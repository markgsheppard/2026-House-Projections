name: Election results

# Keeps results.json (and county-shift.json for the Shift view) current on
# election night and through the count. Each run loops for about five hours:
# pull the AP calls and counts, commit when something changed, sleep two
# minutes, repeat, and queue the next run before finishing. GitHub Pages
# redeploys on every commit. The cron is only a backstop that restarts the chain
# if a run dies; the concurrency group queues at most one follow-up run behind
# the active one. After END_UTC a run disables this workflow instead of fetching, so
# the chain stops on its own; after SLOW_FROM_UTC each pass waits ten minutes rather
# than two, since by then only the slow late counts are moving.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: election-results
  cancel-in-progress: false

env:
  END_UTC: "2026-11-21T05:00:00Z"   # midnight ET at the end of November 20
  SLOW_FROM_UTC: "2026-11-08T05:00:00Z"   # from November 8 (midnight ET) the loop sleeps ten minutes instead of two

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Stop after the end time
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s); end=$(date -u -d "$END_UTC" +%s)
          if [ "$now" -ge "$end" ]; then
            echo "past $END_UTC: disabling the workflow"
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/results.yml/disable" || echo "could not disable the workflow"
            echo "stop=1" >> "$GITHUB_OUTPUT"
          else
            echo "stop=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.stop == '0'
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.stop == '0'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.stop == '0'
        run: pip install --quiet requests

      - name: Fetch results every 2 minutes
        if: steps.gate.outputs.stop == '0'
        env:
          PASSES: 140
          SLEEP: 120
          SLOW_SLEEP: 600
        run: |
          # never let one bad pass end the run: a failed fetch or push is retried on the next pass
          set +e
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          end=$(date -u -d "$END_UTC" +%s)
          sync_main() {
            # bring the local tree up to date; on any trouble, drop local state and take origin/main
            git pull -q --rebase origin main && return 0
            echo "pull failed; resetting to origin/main"
            git rebase --abort >/dev/null 2>&1
            git fetch -q origin main && git reset -q --hard origin/main
          }
          for i in $(seq 1 "$PASSES"); do
            if [ "$(date -u +%s)" -ge "$end" ]; then echo "past $END_UTC, stopping"; break; fi
            echo "== pass $i of $PASSES at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            sync_main
            python scripts/fetch_results.py || echo "fetch failed, will retry on the next pass"
            # county margins for the Shift view: Senate and governor races every other pass, House every fifth pass
            args=""
            if [ $((i % 2)) -eq 1 ]; then args="--senate --governor"; fi
            if [ $((i % 5)) -eq 1 ]; then args="$args --house"; fi
            if [ -n "$args" ]; then python scripts/fetch_counties.py $args || echo "county fetch failed, will retry"; fi
            if git diff --quiet -- results.json county-shift.json && [ -n "$(git ls-files results.json)" ] && [ -z "$(git ls-files --others --exclude-standard county-shift.json)" ]; then
              echo "no change in results.json or county-shift.json"
            else
              git add results.json; [ -f county-shift.json ] && git add county-shift.json
              git commit -q -m "Results: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
              pushed=0
              for attempt in 1 2 3 4; do
                if git push -q origin HEAD:main; then pushed=1; break; fi
                echo "push failed (attempt $attempt); retrying"
                sleep $((attempt * 15))
                sync_main
              done
              if [ "$pushed" = 1 ]; then echo "pushed"; else echo "could not push this pass; the next pass will try again"; fi
            fi
            if [ "$i" -lt "$PASSES" ]; then
              if [ "$(date -u +%s)" -ge "$(date -u -d "$SLOW_FROM_UTC" +%s)" ]; then sleep "$SLOW_SLEEP"; else sleep "$SLEEP"; fi
            fi
          done

      - name: Start the next run
        # the chain restarts itself; the cron is only a backstop, since GitHub's schedule can skip beats
        if: steps.gate.outputs.stop == '0' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d "$END_UTC" +%s)" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/results.yml/dispatches" -f ref=main && echo "next run queued" || echo "could not queue the next run; the cron will"
          fi
